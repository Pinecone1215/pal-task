<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <title>PAL 測驗</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/task.css" rel="stylesheet">
    <script src="js/task.js" defer></script>
</head>

<body>
    <main>
        <div id="start-screen" hidden>
            <p>
                按下「開始測驗」後，將進入全螢幕模式。<br>
                測驗進行期間請保持全螢幕，並盡量不要切換至其他視窗。
            </p>
            <button id="start-task-button">開始測驗</button>
        </div>

        <div id="msg-screen" hidden>
            <p id="msg-title"></p>
            <p id="msg-desc"></p>
        </div>

        <div id="stimulus-screen">
            <div class="center-pos">
                <span id="fixation">+</span>
                <img alt="" hidden>
            </div>

            <button class="pos-btn" data-pos="top-left" type="button" disabled>
                <img alt="" hidden>
                <span class="correct-pos" hidden>Correct Position Display</span>
            </button>

            <button class="pos-btn" data-pos="top" type="button" disabled>
                <img alt="" hidden>
                <span class="correct-pos" hidden>Correct Position Display</span>
            </button>

            <button class="pos-btn" data-pos="top-right" type="button" disabled>
                <img alt="" hidden>
                <span class="correct-pos" hidden>Correct Position Display</span>
            </button>

            <button class="pos-btn" data-pos="left" type="button" disabled>
                <img alt="" hidden>
                <span class="correct-pos" hidden>Correct Position Display</span>
            </button>

            <button class="pos-btn" data-pos="right" type="button" disabled>
                <img alt="" hidden>
                <span class="correct-pos" hidden>Correct Position Display</span>
            </button>

            <button class="pos-btn" data-pos="bottom-left" type="button" disabled>
                <img alt="" hidden>
                <span class="correct-pos" hidden>Correct Position Display</span>
            </button>

            <button class="pos-btn" data-pos="bottom" type="button" disabled>
                <img alt="" hidden>
                <span class="correct-pos" hidden>Correct Position Display</span>
            </button>

            <button class="pos-btn" data-pos="bottom-right" type="button" disabled>
                <img alt="" hidden>
                <span class="correct-pos" hidden>Correct Position Display</span>
            </button>
        </div>
    </main>
</body>
</html>
