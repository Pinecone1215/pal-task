<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <title>PAL 測驗</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/task.css" rel="stylesheet">
    <script src="js/task.js" defer></script>
</head>

<body>
    <main>
        <div id="start-screen" class="active">
            <p>
                按下「開始測驗」後，將進入全螢幕模式。<br>
                測驗進行期間請保持全螢幕，並盡量不要切換至其他視窗。
            </p>
            <button id="start-task-button">開始測驗</button>
        </div>

        <div id="message">
            <p id="message-title"></p>
            <p id="message-desc"></p>
        </div>
        
        <div id="fixation">+</div>

        <div id="stimulus-screen">
            <button class="position" data-position="top-left" type="button" disabled></button>
            <button class="position" data-position="top"
                    type="button" disabled></button>
            <button class="position" data-position="top-right"
                    type="button" disabled></button>
            <button class="position" data-position="left"
                    type="button" disabled></button>
            <button class="position" data-position="right"
                    type="button" disabled></button>
            <button class="position" data-position="bottom-left"
                    type="button" disabled></button>
            <button class="position" data-position="bottom"
                    type="button" disabled></button>
            <button class="position" data-position="bottom-right"
                    type="button" disabled></button>

            <span id="stimulus-fixation" hidden>+</span>
            <img id="stimulus" alt="" hidden>
            <span id="correct-position" hidden>
                Correct Position Display
            </span>
        </div>
    </main>
</body>
</html>
